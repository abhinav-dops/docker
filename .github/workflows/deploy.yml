name: CI/CD to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ Build and Push Docker Image
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/hello-app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      # 2️⃣ Deploy to EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:latest

            echo "Stopping old container..."
            docker stop hello-app || true
            docker rm hello-app || true

            echo "Starting new container..."
            docker run -d --name hello-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:latest

            echo "Waiting for app to come up..."
            sleep 10

            echo "Running health check..."
            if curl -s http://localhost | grep -q "Hello"; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed — rolling back!"
              docker stop hello-app
              docker rm hello-app
              docker run -d --name hello-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:previous
              exit 1
            fi

